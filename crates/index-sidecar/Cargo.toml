[package]
name = "arkts-index-sidecar"
version = "0.1.0"
edition = "2024"
publish = false

[features]
experimental-occurrence-without-rowid = ["arkts-index-sqlite/experimental-occurrence-without-rowid"]

[dependencies]
arkts-index-core = { path = "../index-core" }
arkts-index-sqlite = { path = "../index-sqlite" }
ignore = "=0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
