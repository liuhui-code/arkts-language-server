name: Zed extension

on:
  pull_request:
    paths:
      - ".github/workflows/zed-extension.yml"
      - ".node-version"
      - "editors/zed/**"
      - "scripts/check-zed-queries.sh"
      - "scripts/check-release.sh"
      - "scripts/install-local.sh"
      - "scripts/install-zed-local.mjs"
      - "scripts/bench/windows-zed-smoke.mjs"
      - "scripts/bench/closure-*"
      - "scripts/bench/measure-compiler-closure.mjs"
      - "scripts/build-runtime.mjs"
      - "scripts/compiler-observation-plugin.mjs"
      - "scripts/measure-witness-budget.mjs"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "bin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-extension.yml"
      - ".node-version"
      - "editors/zed/**"
      - "scripts/check-zed-queries.sh"
      - "scripts/check-release.sh"
      - "scripts/install-local.sh"
      - "scripts/install-zed-local.mjs"
      - "scripts/bench/windows-zed-smoke.mjs"
      - "scripts/bench/closure-*"
      - "scripts/bench/measure-compiler-closure.mjs"
      - "scripts/build-runtime.mjs"
      - "scripts/compiler-observation-plugin.mjs"
      - "scripts/measure-witness-budget.mjs"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "bin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARKTS_INDEX_REAL_FIXTURE: ${{ github.workspace }}/.fixtures/nim-uikit-harmony
      ARKTS_LARGE_FIXTURE: ${{ github.workspace }}/.fixtures/nim-uikit-harmony
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out the pinned large ArkTS fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: netease-kit/nim-uikit-harmony
          ref: 585feb45114a128a0d2a23947c83faf338e758f7
          path: .fixtures/nim-uikit-harmony
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - name: Install the frozen Node dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install the Zed WebAssembly target
        run: rustup target add wasm32-wasip2

      - name: Run the canonical release gate
        run: pnpm check:release

  windows-install:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Enable the pinned pnpm version
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - name: Install the Zed WebAssembly target
        run: rustup target add wasm32-wasip2

      - name: Install into an isolated Zed profile
        shell: pwsh
        env:
          npm_config_lockfile: 'false'
        run: pnpm zed:install -- --zed-user-data-dir "$env:RUNNER_TEMP\Zed" --bin-dir "$env:RUNNER_TEMP\arkts\bin"

      - name: Reinstall into the same Zed profile
        shell: pwsh
        run: pnpm zed:install -- --zed-user-data-dir "$env:RUNNER_TEMP\Zed" --bin-dir "$env:RUNNER_TEMP\arkts\bin"

      - name: Validate installed extension and LSP process
        shell: pwsh
        run: node scripts/bench/windows-zed-smoke.mjs "$env:RUNNER_TEMP\Zed"

  windows-stage12:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Enable the pinned pnpm version
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@8.15.9 --activate

      - name: Install the frozen Node dependency graph
        run: pnpm install --frozen-lockfile

      - name: Typecheck the current checkout
        run: pnpm check

      - name: Build the current runtime
        run: pnpm build

      - name: Build the native Windows sidecar
        run: cargo build --locked --package arkts-index-sidecar --release --target-dir target

      - name: Run stage 1 and 2 on native Windows paths
        shell: pwsh
        run: |
          # Isolate this slice from the unmerged PR116 8.3-path repair.
          # The existing windows-install smoke retains the runner's default TEMP.
          $nativeTemp = node -e "process.stdout.write(require('node:fs').realpathSync.native(require('node:os').tmpdir()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Stage 1/2 ordinary-path scope: TEMP=$env:TEMP native=$nativeTemp"
          $env:TEMP = $nativeTemp
          $env:TMP = $nativeTemp
          node -e "const fs=require('node:fs'),p=require('node:os').tmpdir();const ordinary=fs.realpathSync(p),native=fs.realpathSync.native(p);console.log(JSON.stringify({temp:p,ordinary,native}));if(ordinary!==native)throw Error('Stage 1/2 ordinary-path isolation failed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 tests/closure-baseline-cli.test.mjs tests/closure-observation-report.test.mjs tests/exact-witness-facts.test.mjs tests/semantic/large-closure-witness-budget.test.mjs tests/semantic/large-sdk-witness-budget.test.mjs tests/semantic/witness-budget-overflow.test.mjs
