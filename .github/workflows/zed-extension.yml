name: Zed extension

on:
  pull_request:
    paths:
      - ".github/workflows/zed-extension.yml"
      - "editors/zed/**"
      - "scripts/check-zed-queries.sh"
      - "scripts/install-local.sh"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "bin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-extension.yml"
      - "editors/zed/**"
      - "scripts/check-zed-queries.sh"
      - "scripts/install-local.sh"
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "bin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARKTS_INDEX_REAL_FIXTURE: ${{ github.workspace }}/.fixtures/nim-uikit-harmony
      ARKTS_LARGE_FIXTURE: ${{ github.workspace }}/.fixtures/nim-uikit-harmony
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out the pinned large ArkTS fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: netease-kit/nim-uikit-harmony
          ref: 585feb45114a128a0d2a23947c83faf338e758f7
          path: .fixtures/nim-uikit-harmony
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5

      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - name: Install the frozen Node dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run the fast Node quality gate
        run: pnpm check:fast

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint the Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test the Rust workspace
        run: cargo test --locked --workspace --all-targets

      - name: Gate the pinned 455-file catalog and deterministic queries
        run: >-
          cargo test --locked -p arkts-index-sidecar --test ndjson_protocol
          pinned_large_arkts_fixture_meets_cold_catalog_and_deterministic_query_gates
          -- --ignored --exact

      - name: Build the production index sidecar
        run: cargo build --locked --workspace --release

      - name: Install the Zed WebAssembly target
        run: rustup target add wasm32-wasip2

      - name: Compile every ArkTS query against the pinned grammar
        run: ./scripts/check-zed-queries.sh

      - name: Check and build the Zed adapter
        working-directory: editors/zed
        run: |
          cargo fmt --check
          cargo build --locked --target wasm32-wasip2 --release

      - name: Run the release acceptance gate
        run: pnpm check:release
